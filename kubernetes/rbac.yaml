apiVersion: v1
kind: ServiceAccount
metadata:
  name: spiffe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spiffe
rules:
  # The plugin reads Cluster objects to build the injected Pod patch.
  # Clusters can live in any namespace, so this needs to be cluster-scoped.
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spiffe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spiffe
subjects:
  - kind: ServiceAccount
    name: spiffe
    namespace: cnpg-system
