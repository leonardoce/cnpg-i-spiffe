apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spiffe-server
spec:
  secretName: spiffe-server-tls
  commonName: "spiffe"
  dnsNames:
    - spiffe

  duration: 2160h # 90d
  renewBefore: 360h # 15d

  isCA: false
  usages:
    - server auth

  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
